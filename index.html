<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Side Scroller Shooter</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; background: #1a1a2e;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; cursor: crosshair; }
  #hud {
    position: absolute; top: 10px; left: 10px; color: #fff;
    font-size: 16px; text-shadow: 1px 1px 2px #000;
  }
  #healthBarBg {
    width: 200px; height: 20px; background: #333; border: 2px solid #fff; margin-top: 5px;
  }
  #healthBarFill {
    height: 100%; background: #e74c3c; width: 100%; transition: width 0.1s;
  }
  #msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #fff; font-size: 36px; text-align: center; display: none;
  }
  #startScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.88); color: #fff; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  #startScreen h1 { font-size: 40px; margin-bottom: 10px; }
  #startScreen p { font-size: 16px; line-height: 1.6; max-width: 520px; }
  #startBtn {
    margin-top: 20px; padding: 12px 30px; font-size: 18px; cursor: pointer;
    background: #e74c3c; color: #fff; border: none; border-radius: 6px;
  }
  #score { margin-top: 5px; }
  .weaponSlot {
    width: 70px; padding: 6px 4px; text-align: center; font-size: 11px;
    border: 2px solid #555; border-radius: 4px; background: rgba(0,0,0,0.5);
    color: #ccc;
  }
  .weaponSlot.active {
    border-color: #f1c40f; color: #fff; background: rgba(241,196,15,0.2);
  }
  .weaponSlot .key { font-weight: bold; color: #f1c40f; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>⚔ SIDE SHOOTER ⚔</h1>
  <p>
    A / D to move &nbsp;|&nbsp; W or SPACE to jump<br>
    Left Click to shoot (hold for auto-fire) &nbsp;|&nbsp; Hold SHIFT to zoom in<br>
    Press 1-4 or scroll to swap weapons: Pistol, Machine Gun, Shotgun, Sniper<br>
    Enemies come in squads of 2 — clear them to advance!
  </p>
  <button id="startBtn">Start Game</button>
</div>

<div id="hud" style="display:none;">
  <div>Health</div>
  <div id="healthBarBg"><div id="healthBarFill"></div></div>
  <div id="score">Score: 0</div>
  <div id="wave">Wave: 1</div>
  <div id="weaponBar" style="margin-top:10px; display:flex; gap:8px;"></div>
</div>

<div id="msg"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// ---------- World constants ----------
const GROUND_Y = 0;
const GRAVITY = 0.9;
const JUMP_FORCE = -15;

// ---------- Game State ----------
let running = false;
let score = 0;
let wave = 1;
let waveTransitioning = false;

const player = {
  x: 0, y: GROUND_Y,
  w: 28, h: 46,
  vx: 0, vy: 0,
  speed: 5,
  onGround: true,
  health: 100,
  maxHealth: 100,
  facing: 1
};

const keys = {};
let mouse = { x: 0, y: 0, down: false };
let zoom = 1;
const NORMAL_ZOOM = 1;
const ZOOM_LEVEL = 1.8;

let bullets = [];
let enemies = [];
let particles = [];

const SQUAD_SIZE = 2;
let enemiesLeftInWave = 0;
let squadQueued = false;

// ---------- Weapons ----------
const GUNS = [
  { name: 'Pistol',      key: '1', damage: 18, cooldown: 10, bulletSpeed: 17, pellets: 1, spread: 0,    bulletLife: 55, color: '#f1c40f' },
  { name: 'Machine Gun', key: '2', damage: 8,  cooldown: 3,  bulletSpeed: 19, pellets: 1, spread: 0.06, bulletLife: 50, color: '#e67e22' },
  { name: 'Shotgun',     key: '3', damage: 9,  cooldown: 26, bulletSpeed: 15, pellets: 5, spread: 0.35, bulletLife: 26, color: '#e74c3c' },
  { name: 'Sniper',      key: '4', damage: 70, cooldown: 45, bulletSpeed: 30, pellets: 1, spread: 0,    bulletLife: 70, color: '#1abc9c' }
];
let currentGunIndex = 0;
function currentGun() { return GUNS[currentGunIndex]; }

function switchGun(index) {
  if (index < 0 || index >= GUNS.length) return;
  currentGunIndex = index;
  renderWeaponBar();
}

function renderWeaponBar() {
  const bar = document.getElementById('weaponBar');
  bar.innerHTML = '';
  GUNS.forEach((g, i) => {
    const div = document.createElement('div');
    div.className = 'weaponSlot' + (i === currentGunIndex ? ' active' : '');
    div.innerHTML = '<span class="key">' + g.key + '</span><br>' + g.name;
    bar.appendChild(div);
  });
}

// ---------- Background decoration (generated once) ----------
const STAR_PERIOD = 1400; // world units before star field repeats
const stars = Array.from({ length: 60 }, () => ({
  baseX: Math.random() * STAR_PERIOD,
  yPct: Math.random() * 0.55,
  size: 1 + Math.random() * 2,
  phase: Math.random() * Math.PI * 2
}));

// ---------- Input ----------
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Shift') zoom = ZOOM_LEVEL;
  if ((e.key === ' ' || e.key.toLowerCase() === 'w') && player.onGround && running) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
  }
  const gunIdx = GUNS.findIndex(g => g.key === e.key);
  if (gunIdx !== -1 && running) switchGun(gunIdx);
});
canvas.addEventListener('wheel', e => {
  if (!running) return;
  e.preventDefault();
  const dir = e.deltaY > 0 ? 1 : -1;
  switchGun((currentGunIndex + dir + GUNS.length) % GUNS.length);
}, { passive: false });
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (e.key === 'Shift') zoom = NORMAL_ZOOM;
});
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  mouse.down = true;
  shoot();
});
canvas.addEventListener('mouseup', e => {
  if (e.button !== 0) return;
  mouse.down = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

let fireCooldown = 0;

// ---------- Helpers ----------
function worldToScreen(wx, wy) {
  const cx = canvas.width / 2;
  const groundScreenY = canvas.height * 0.75;
  return {
    x: cx + (wx - player.x) * zoom,
    y: groundScreenY + (wy - player.y) * zoom
  };
}

function rectsOverlap(a, b) {
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

// ---------- Bullets ----------
function shoot() {
  if (!running) return;
  const gun = currentGun();
  for (let i = 0; i < gun.pellets; i++) {
    const spreadAngle = gun.pellets === 1
      ? 0
      : (i - (gun.pellets - 1) / 2) * (gun.spread / (gun.pellets - 1));
    const wiggle = gun.spread > 0 && gun.pellets === 1 ? (Math.random() - 0.5) * gun.spread : 0;
    const angle = spreadAngle + wiggle;
    bullets.push({
      x: player.x + player.facing * player.w * 0.6,
      y: player.y - player.h * 0.6,
      vx: player.facing * gun.bulletSpeed * Math.cos(angle),
      vy: gun.bulletSpeed * Math.sin(angle),
      life: gun.bulletLife,
      damage: gun.damage,
      color: gun.color
    });
  }
}

// ---------- Enemies ----------
function spawnEnemy() {
  const side = Math.random() < 0.5 ? -1 : 1;
  const ex = player.x + side * (500 + Math.random() * 150);
  const hp = 30 + wave * 8;
  enemies.push({
    x: ex, y: GROUND_Y,
    w: 26, h: 42,
    speed: 1.4 + wave * 0.08,
    health: hp,
    maxHealth: hp,
    damage: 6
  });
}

function spawnSquad() {
  const count = Math.min(SQUAD_SIZE, enemiesLeftInWave);
  for (let i = 0; i < count; i++) spawnEnemy();
  enemiesLeftInWave -= count;
  squadQueued = false;
}

function startWave() {
  enemiesLeftInWave = 4 + wave * 2;
  spawnSquad();
}

// ---------- Particles ----------
function spawnParticles(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      life: 25,
      color
    });
  }
}

// ---------- Update ----------
function update() {
  if (!running) return;

  let dx = 0;
  if (keys['a']) dx -= 1;
  if (keys['d']) dx += 1;
  player.vx = dx * player.speed;
  if (dx !== 0) player.facing = dx > 0 ? 1 : -1;
  player.x += player.vx;

  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
  }

  if (fireCooldown > 0) fireCooldown--;
  if (mouse.down && fireCooldown <= 0) {
    shoot();
    fireCooldown = currentGun().cooldown;
  }

  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; b.life--; });
  bullets = bullets.filter(b => b.life > 0);

  enemies.forEach(en => {
    const dir = player.x > en.x ? 1 : -1;
    en.x += dir * en.speed;

    const pRect = { left: player.x - player.w/2, right: player.x + player.w/2, top: player.y - player.h, bottom: player.y };
    const eRect = { left: en.x - en.w/2, right: en.x + en.w/2, top: en.y - en.h, bottom: en.y };
    if (rectsOverlap(pRect, eRect)) {
      player.health -= en.damage * 0.05;
    }
  });

  bullets.forEach(b => {
    enemies.forEach(en => {
      if (en.health <= 0) return;
      const eRect = { left: en.x - en.w/2, right: en.x + en.w/2, top: en.y - en.h, bottom: en.y };
      if (b.x > eRect.left && b.x < eRect.right && b.y > eRect.top && b.y < eRect.bottom) {
        en.health -= b.damage;
        b.life = 0;
        if (en.health <= 0) {
          spawnParticles(en.x, en.y - en.h/2, '#e74c3c');
          score += 10;
        }
      }
    });
  });
  enemies = enemies.filter(en => en.health > 0);
  bullets = bullets.filter(b => b.life > 0);

  if (enemies.length === 0 && enemiesLeftInWave > 0 && !squadQueued) {
    squadQueued = true;
    setTimeout(spawnSquad, 700);
  }

  if (enemies.length === 0 && enemiesLeftInWave === 0 && !squadQueued && !waveTransitioning) {
    waveTransitioning = true;
    wave++;
    document.getElementById('wave').textContent = 'Wave: ' + wave;
    setTimeout(() => {
      waveTransitioning = false;
      startWave();
    }, 1500);
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  if (player.health < 0) player.health = 0;
  document.getElementById('healthBarFill').style.width = (player.health / player.maxHealth * 100) + '%';
  document.getElementById('score').textContent = 'Score: ' + score;

  if (player.health <= 0) endGame();
}

// ---------- Background helpers ----------
function tiledX(baseWorldX, parallaxFactor, spacingWorld) {
  const spacingScreen = spacingWorld * zoom;
  const camScreen = player.x * parallaxFactor * zoom;
  let x = ((baseWorldX * zoom - camScreen) % spacingScreen + spacingScreen) % spacingScreen;
  return x;
}

function drawRidgeLayer(baseYPct, peakHeight, spacing, parallaxFactor, color) {
  const baseY = canvas.height * baseYPct;
  const spacingScreen = spacing * zoom;
  const camScreen = player.x * parallaxFactor * zoom;
  let start = -spacingScreen - (camScreen % spacingScreen);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(start, canvas.height);
  ctx.lineTo(start, baseY);
  for (let x = start; x < canvas.width + spacingScreen; x += spacingScreen) {
    const peakX = x + spacingScreen / 2;
    ctx.lineTo(peakX, baseY - peakHeight * zoom);
    ctx.lineTo(x + spacingScreen, baseY);
  }
  ctx.lineTo(canvas.width + spacingScreen, canvas.height);
  ctx.closePath();
  ctx.fill();
}

function drawCloud(x, y, scale) {
  ctx.fillStyle = 'rgba(255, 235, 220, 0.85)';
  const blocks = [
    [-18, 0, 26, 10], [-4, -8, 22, 12], [14, 0, 20, 9], [-22, 6, 46, 8]
  ];
  blocks.forEach(([bx, by, bw, bh]) => {
    ctx.fillRect(x + bx * scale, y + by * scale, bw * scale, bh * scale);
  });
}

function drawBackground() {
  const groundScreenY = canvas.height * 0.75;

  // dusk sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, groundScreenY);
  sky.addColorStop(0, '#241b3a');
  sky.addColorStop(0.55, '#4a2f5c');
  sky.addColorStop(1, '#d97a4a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, groundScreenY);

  // soft sun glow near the horizon (radial gradient, not a hard shape)
  const glow = ctx.createRadialGradient(
    canvas.width * 0.5, groundScreenY * 0.95, 0,
    canvas.width * 0.5, groundScreenY * 0.95, groundScreenY * 0.6
  );
  glow.addColorStop(0, 'rgba(255, 200, 140, 0.55)');
  glow.addColorStop(1, 'rgba(255, 200, 140, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, canvas.width, groundScreenY);

  // stars (upper sky only, gently twinkling)
  const t = performance.now() / 500;
  stars.forEach(s => {
    const sx = tiledX(s.baseX, 0.05, STAR_PERIOD) - (STAR_PERIOD * zoom) / 2;
    const sy = s.yPct * groundScreenY * 0.7;
    const twinkle = 0.5 + 0.5 * Math.sin(t + s.phase);
    ctx.fillStyle = `rgba(255,255,255,${0.3 + twinkle * 0.5})`;
    [sx, sx + STAR_PERIOD * zoom].forEach(px => {
      if (px > -10 && px < canvas.width + 10) {
        ctx.fillRect(px, sy, s.size * zoom, s.size * zoom);
      }
    });
  });

  // distant mountain ridge
  drawRidgeLayer(0.72, 140, 300, 0.15, '#3a2a52');
  // nearer hill ridge
  drawRidgeLayer(0.78, 90, 220, 0.32, '#5c3d5e');

  // drifting clouds
  const cloudSpacing = 380;
  const camScreen = player.x * 0.4 * zoom;
  let cStart = -cloudSpacing * zoom - (camScreen % (cloudSpacing * zoom));
  for (let x = cStart; x < canvas.width + cloudSpacing * zoom; x += cloudSpacing * zoom) {
    drawCloud(x + cloudSpacing * zoom * 0.5, groundScreenY * 0.22, zoom);
  }
}
function drawCharacter(s, w, h, facing, bodyColor, headColor) {
  const headH = h * 0.28;
  const bodyH = h - headH;
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(s.x - w/2, s.y - bodyH * 0.35, w * 0.4, bodyH * 0.35);
  ctx.fillRect(s.x + w/2 - w*0.4, s.y - bodyH * 0.35, w * 0.4, bodyH * 0.35);
  ctx.fillStyle = bodyColor;
  ctx.fillRect(s.x - w/2, s.y - bodyH, w, bodyH * 0.65);
  ctx.fillStyle = headColor;
  ctx.fillRect(s.x - w * 0.32, s.y - h, w * 0.64, headH);
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(s.x + facing * (w/2), s.y - bodyH * 0.75, facing * w * 0.35, h * 0.08);
}

// ---------- Draw ----------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();

  const groundScreenY = canvas.height * 0.75;

  const groundGrad = ctx.createLinearGradient(0, groundScreenY, 0, canvas.height);
  groundGrad.addColorStop(0, '#4a3b2a');
  groundGrad.addColorStop(1, '#2c2318');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, groundScreenY, canvas.width, canvas.height - groundScreenY);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  const stripe = 60 * zoom;
  const offsetX = ((-player.x * zoom) % stripe + stripe) % stripe;
  for (let x = offsetX; x < canvas.width; x += stripe) {
    ctx.beginPath();
    ctx.moveTo(x, groundScreenY);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  ctx.strokeStyle = '#e8956a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, groundScreenY);
  ctx.lineTo(canvas.width, groundScreenY);
  ctx.stroke();

  bullets.forEach(b => {
    const s = worldToScreen(b.x, b.y);
    ctx.fillStyle = b.color || '#f1c40f';
    ctx.fillRect(s.x - 5 * zoom, s.y - 2 * zoom, 10 * zoom, 4 * zoom);
  });

  enemies.forEach(en => {
    const s = worldToScreen(en.x, en.y);
    const facing = player.x > en.x ? 1 : -1;
    drawCharacter(s, en.w * zoom, en.h * zoom, facing, '#c0392b', '#7a2d1f');

    const barW = 34 * zoom;
    const hpPct = en.health / en.maxHealth;
    ctx.fillStyle = '#222';
    ctx.fillRect(s.x - barW/2, s.y - en.h*zoom - 14*zoom, barW, 5*zoom);
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(s.x - barW/2, s.y - en.h*zoom - 14*zoom, barW * hpPct, 5*zoom);
  });

  particles.forEach(p => {
    const s = worldToScreen(p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 25;
    ctx.fillRect(s.x - 3*zoom, s.y - 3*zoom, 6*zoom, 6*zoom);
    ctx.globalAlpha = 1;
  });

  const ps = { x: canvas.width / 2, y: groundScreenY };
  drawCharacter(ps, player.w * zoom, player.h * zoom, player.facing, '#3498db', '#1f5f8b');

  if (zoom > 1) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '14px Courier New';
    ctx.fillText('ZOOMED', 10, canvas.height - 15);
  }
}

// ---------- Loop ----------
function loop() {
  update();
  draw();
  if (running) requestAnimationFrame(loop);
}

// ---------- Game Flow ----------
function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('msg').style.display = 'none';
  player.x = 0; player.y = GROUND_Y; player.vy = 0; player.health = 100;
  bullets = []; enemies = []; particles = [];
  score = 0; wave = 1;
  waveTransitioning = false;
  squadQueued = false;
  currentGunIndex = 0;
  renderWeaponBar();
  document.getElementById('wave').textContent = 'Wave: 1';
  running = true;
  startWave();
  loop();
}

function endGame() {
  running = false;
  const msg = document.getElementById('msg');
  msg.style.display = 'block';
  msg.innerHTML = 'GAME OVER<br><span style="font-size:20px">Score: ' + score + '</span><br><button id="retryBtn" style="margin-top:15px;padding:10px 25px;font-size:16px;cursor:pointer;background:#e74c3c;color:#fff;border:none;border-radius:6px;">Try Again</button>';
  document.getElementById('retryBtn').addEventListener('click', startGame);
}

document.getElementById('startBtn').addEventListener('click', startGame);
</script>

</body>
</html>
